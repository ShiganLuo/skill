# systemd 服务单元模板 → 复制到 /etc/systemd/system/<name>.service 后填空
# 填完必须: sudo systemctl daemon-reload && sudo systemctl enable --now <name>

[Unit]
Description=<服务描述>
# 外连型客户端用 network-online（真的连通）；纯本机服务用 network.target 即可
After=network-online.target
Wants=network-online.target

[Service]
Type=simple
User=<与原手动进程同身份，否则读不到它的配置/密钥>
WorkingDirectory=<原进程的 cwd，readlink /proc/<pid>/cwd，相对路径 -c 依赖它>
ExecStart=<绝对路径>/binary -c <绝对路径>/config.toml
Restart=always
RestartSec=3

[Install]
WantedBy=multi-user.target
